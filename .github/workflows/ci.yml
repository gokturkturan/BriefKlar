name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Read by the API's config at import time; the tests never connect or call the model
      DATABASE_URL: postgresql://briefklar:briefklar@localhost:5432/briefklar
      REDIS_URL: redis://localhost:6379
      ANTHROPIC_API_KEY: not-used-in-tests
      OPENAI_API_KEY: not-used-in-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @briefklar/web

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t briefklar-api .
      - name: Build the web image
        run: docker build -f apps/web/Dockerfile -t briefklar-web .
