# Production: everything on one host with Docker.
#   cp deploy/.env.production.example deploy/.env.production   (and fill it in)
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
# The migrate service applies database migrations before the API and worker start.

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgresql://briefklar:${POSTGRES_PASSWORD:?}@postgres:5432/briefklar
  REDIS_URL: redis://redis:6379
  UPLOAD_DIR: /data/uploads
  # Only for CORS; the browser calls the API on the same origin through Caddy
  WEB_ORIGIN: https://${DOMAIN:?}
  # The API checks that the providers in use have a key (apps/api/src/config/env.ts)
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
  LLM_EMBEDDING_PROVIDER: ${LLM_EMBEDDING_PROVIDER:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
  GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL-gemini-flash-lite-latest}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
  ANTHROPIC_FALLBACK_MODEL: ${ANTHROPIC_FALLBACK_MODEL:-}
  ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
  OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefklar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: briefklar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefklar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires keys never to be evicted
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: briefklar-api
    command: ["npm", "run", "db:deploy"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: briefklar-api
    restart: unless-stopped
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: briefklar-api
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    environment: *api-env
    # The worker reads uploaded letters and deletes them after the retention period
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: briefklar-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - caddydata:/data
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
