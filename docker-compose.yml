services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: briefklar-postgres
    environment:
      POSTGRES_USER: briefklar
      POSTGRES_PASSWORD: briefklar
      POSTGRES_DB: briefklar
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefklar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: briefklar-redis
    # BullMQ requires keys never to be evicted
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
